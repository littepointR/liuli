[package]
name = "liuli"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
embedded-graphics-core.workspace = true
liuli-core.workspace = true
liuli-text.workspace = true
liuli-render.workspace = true
liuli-enhanced = { version = "=1.0.0", path = "../liuli-enhanced", optional = true, default-features = false }

[dev-dependencies]
liuli-core = { workspace = true, features = ["host-testing"] }

[features]
host-testing=["liuli-core/host-testing"]
scene-planner=["liuli-core/scene-planner"]
part-painters=["liuli-core/part-painters"]
default = []
owned-images = ["liuli-core/owned-images"]
layers = ["owned-images", "liuli-render/layers"]
multitouch = ["dep:liuli-enhanced", "liuli-enhanced/gestures"]
complex-text = ["dep:liuli-enhanced", "liuli-enhanced/text"]
text-field = ["complex-text", "owned-images", "liuli-enhanced/field"]
enhanced = ["layers", "multitouch", "text-field"]
platform-blend = []
inspector=["liuli-core/inspector"]
