[workspace]
resolver = "3"

[package]
name = "liuli-fk743m2"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false
build = "build.rs"

[features]
diagnostics = []
touch-irq = []
default = ["st-hal", "enhanced", "showcase"]
st-hal = []
embassy = ["dep:embassy-stm32", "dep:embassy-executor", "dep:embassy-time", "dep:cortex-m-rt"]
enhanced = ["liuli/enhanced", "liuli-widget-demo/enhanced", "dep:linked_list_allocator"]
showcase = []

[dependencies]
embassy-stm32 = { version = "=0.6.0", default-features = false, features = ["stm32h743ii", "rt", "time-driver-tim5"], optional = true }
embassy-executor = { version = "=0.10.0", features = ["platform-cortex-m", "executor-thread"], optional = true }
embassy-time = { version = "0.5", optional = true }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7", optional = true }
liuli = { path = "../../crates/liuli", version = "=1.0.0" }
liuli-widget-demo = { path = "../../apps/liuli-widget-demo", version = "=1.0.0" }
embedded-graphics-core = { version = "=0.4.1", default-features = false }
linked_list_allocator = { version = "=0.10.6", default-features = false, optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
