[workspace]

[package]
name="liuli-s3-runtime"
version="1.0.0"
edition="2024"
license="MIT"
publish=false

[lib]
crate-type=["staticlib"]

[dependencies]
liuli={path="../../../crates/liuli",features=["platform-blend"]}
liuli-alarms={path="../../../apps/liuli-alarms"}
liuli-widget-demo={path="../../../apps/liuli-widget-demo",optional=true}
embedded-graphics-core = "=0.4.1"

[profile.release]
panic="abort"
opt-level="s"
lto=true
codegen-units=1

[profile.release.package.liuli-core]
opt-level = 3

[profile.release.package.liuli-render]
opt-level = 3

[profile.release.package.liuli-text]
opt-level = 3

[profile.release.package.embedded-graphics-core]
opt-level = 3

[profile.release.package.liuli-s3-runtime]
opt-level = 3

[features]
effects-benchmark=["widget-demo"]
input-trace=[]
enhanced=["liuli/enhanced"]
benchmark=["enhanced"]
sleep-benchmark=["benchmark"]
widget-demo=["enhanced","dep:liuli-widget-demo","liuli-widget-demo/enhanced"]
