[workspace]

[package]
name="liuli-s3-runtime"
version="0.3.0-dev.1"
edition="2024"
license="MIT"
publish=false

[lib]
crate-type=["staticlib"]

[dependencies]
liuli={path="../../../crates/liuli",features=["platform-blend"]}
liuli-alarms={path="../../../apps/liuli-alarms"}
embedded-graphics-core = "=0.4.1"

[profile.release]
panic="abort"
opt-level="s"
codegen-units=1

[features]
enhanced=["liuli/enhanced"]
benchmark=["enhanced"]
sleep-benchmark=["benchmark"]
