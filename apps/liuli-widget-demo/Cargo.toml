[package]
name = "liuli-widget-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Spool field recorder UI demo for desktop, ESP32-S3 and STM32H743"

[dependencies]
liuli.workspace = true
liuli-widgets = { version = "=1.0.0", path = "../../crates/liuli-widgets" }
liuli-sim = { version = "=1.0.0", path = "../../host/liuli-sim", optional = true, default-features = false }

[features]
desktop = ["dep:liuli-sim"]
enhanced = ["liuli/enhanced"]

[[bin]]
name = "liuli-widget-demo"
path = "src/main.rs"
required-features = ["desktop"]
