name: liuli CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  windows-workspace:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - shell: pwsh
        run: .\checks\audit-locks.ps1
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path checks/firmware/Cargo.toml -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --release --locked
      - run: cargo test -p liuli-core --doc --locked
      - run: cargo test -p liuli-render --doc --locked
      - run: cargo test -p liuli --test capacity --locked -- --nocapture
      - run: cargo test -p liuli-sim --test allocation --release --locked -- --test-threads=1
      - run: cargo run -p liuli-fontpack --locked -- verify
      - run: cargo run -p liuli-sim --example headless --locked
      - run: cargo run -p liuli-sim --locked -- replay host/liuli-sim/tests/fixtures/settings.events --out target/liuli-v01 --format png
      - run: cargo run -p liuli-sim --locked -- replay host/liuli-sim/tests/fixtures/terminal.events --out target/liuli-v02 --format png
      - run: cargo tree -p liuli-settings -e features --locked

  bare-metal-thumbv7em:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: llvm-tools
      - run: cargo check -p liuli-settings --target thumbv7em-none-eabihf --no-default-features --locked
      - working-directory: checks/firmware
        run: cargo build --target thumbv7em-none-eabihf --release --locked
      - shell: pwsh
        run: .\checks\audit-firmware.ps1 -Elf checks/firmware/target/thumbv7em-none-eabihf/release/liuli-firmware -Profile Demo
      - shell: pwsh
        run: |
          $sysroot = (rustc --print sysroot).Trim()
          $llvmBin = Get-ChildItem -Path (Join-Path $sysroot 'lib\rustlib') -Filter 'llvm-objdump.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty DirectoryName
          if ($llvmBin) { $env:PATH = "$llvmBin;$env:PATH" }
          .\checks\audit-stack.ps1 -Elf checks/firmware/target/thumbv7em-none-eabihf/release/liuli-firmware -MaxThreadBytes 6144
      - working-directory: checks/firmware
        run: cargo build --target thumbv7em-none-eabihf --release --locked --features startup-probe --target-dir target/startup-probe
      - shell: pwsh
        run: .\checks\audit-firmware.ps1 -Elf checks/firmware/target/startup-probe/thumbv7em-none-eabihf/release/liuli-firmware -Profile StartupProbe

  desktop-consumers:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fetch --locked
      - run: cargo test --workspace --all-features --release --locked
      - run: cargo run -p liuli-fontpack --locked -- verify --project apps/liuli-alarms/assets/fonts.toml
      - run: python checks/package-sdk.py --fetch-toolchain-inputs
      - uses: actions/upload-artifact@v4
        with:
          name: liuli-sdk-${{ matrix.os }}
          path: target/dist/liuli-sdk-*.zip
          if-no-files-found: error

  esp32s3:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [basic, enhanced, benchmark, sleep-benchmark]
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.5
        with:
          buildtargets: esp32s3
      - run: python3 boards/waveshare-s3-amoled/build.py --rust-only --profile ${{ matrix.profile }}
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
          path: boards/waveshare-s3-amoled
          command: idf.py -DLIULI_RUNTIME=$PWD/../../target/s3/rust/xtensa-esp32s3-none-elf/release/libliuli_s3_runtime.a build
