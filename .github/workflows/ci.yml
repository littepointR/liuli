name: liuli CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  windows-workspace:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo test -p liuli-render --doc --locked
      - run: cargo test -p liuli-sim --test allocation --locked -- --test-threads=1
      - run: cargo tree -p liuli-settings -e features --locked
      - run: cargo run -p liuli-fontpack --locked -- verify
      - run: cargo run -p liuli-sim --example headless --locked
      - run: cargo run -p liuli-sim --locked -- replay host/liuli-sim/tests/fixtures/settings.events --out target/liuli-demo --format png

  bare-metal-thumbv7em:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo check -p liuli-settings --target thumbv7em-none-eabihf --no-default-features --locked
      - run: cargo build --manifest-path checks/firmware/Cargo.toml --target thumbv7em-none-eabihf --release --locked
