[workspace]
resolver = "3"

[package]
name = "liuli-firmware"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
embedded-graphics-core = { version = "=0.4.1", default-features = false }
liuli = { path = "../../crates/liuli" }
liuli-settings = { path = "../../apps/liuli-settings" }

[features]
default = []
startup-probe = []

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
