<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>liuli 嵌入式 GUI 预览</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #141820;
      color: #e6edf5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 20px;
      margin: 0;
    }
    .panel {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
    }
    #screen-box {
      position: relative;
      width: 640px;
      height: 480px;
      border: 2px solid #354155;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
    }
    #screen, #overlay {
      position: absolute;
      left: 0;
      top: 0;
      width: 640px;
      height: 480px;
      image-rendering: pixelated;
      display: block;
    }
    #screen {
      cursor: crosshair;
      touch-action: none;
    }
    #overlay {
      pointer-events: none;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 300px;
      background: #1c222d;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #2e3848;
    }
    .sec-title {
      font-size: 12px;
      color: #8aa0bd;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .btn-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .btn-row-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .toggles {
      display: flex;
      gap: 14px;
      font-size: 12px;
      color: #c8d6e8;
      align-items: center;
    }
    button {
      background: #273244;
      color: #eef4fb;
      border: 1px solid #3c4c64;
      border-radius: 6px;
      padding: 7px 8px;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background: #324158; }
    button.active {
      background: #1877f2;
      border-color: #4d9cff;
    }
    pre {
      background: #10141b;
      padding: 10px;
      border-radius: 6px;
      font-size: 11px;
      margin: 0;
      max-height: 220px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <h2 style="margin:0;">liuli 嵌入式 GUI 预览 (320×240 RGB565)</h2>
  <div class="panel">
    <div id="screen-box">
      <img id="screen" src="/frame.png" width="640" height="480" draggable="false" alt="liuli frame" />
      <canvas id="overlay" width="320" height="240"></canvas>
    </div>
    <div class="controls">
      <div class="sec-title">输入控制</div>
      <div class="btn-row">
        <button onclick="sendInput('prev')">旋钮上一项 (↑/←)</button>
        <button onclick="sendInput('next')">旋钮下一项 (↓/→)</button>
        <button onclick="sendInput('activate')">确认 (Enter)</button>
        <button onclick="sendInput('back')">返回 (Esc)</button>
        <button onclick="sendInput('adjust', -1)">减小 (-)</button>
        <button onclick="sendInput('adjust', 1)">增大 (+)</button>
      </div>
      <div class="sec-title">虚拟时钟</div>
      <div class="btn-row">
        <button id="btn-pause" onclick="togglePause()">暂停时钟</button>
        <button onclick="sendClock('next_deadline')">跳至下一唤醒</button>
      </div>
      <div class="btn-row-3">
        <button onclick="sendClock('step', 16)">+16 ms</button>
        <button onclick="sendClock('step', 100)">+100 ms</button>
        <button onclick="sendClock('step', 1000)">+1000 ms</button>
      </div>
      <div class="btn-row-3">
        <button id="rate-1" onclick="sendClock('rate', 1)">1×</button>
        <button id="rate-4" onclick="sendClock('rate', 4)">4×</button>
        <button id="rate-16" onclick="sendClock('rate', 16)">16×</button>
      </div>
      <div class="sec-title">叠层调试 (不修改设备像素)</div>
      <div class="toggles">
        <label><input type="checkbox" id="chk-damage" checked onchange="drawOverlay()" /> 脏矩形 Damage</label>
        <label><input type="checkbox" id="chk-bands" checked onchange="drawOverlay()" /> 传输条带 Bands</label>
      </div>
      <div style="font-size:11px;color:#9cb0c9;">
        鼠标可在画面点击或拖动列表；键盘方向键/Enter/Esc/+/- 同步可用。
      </div>
      <pre id="state">loading...</pre>
    </div>
  </div>
  <script>
    const img = document.getElementById('screen');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const stateEl = document.getElementById('state');
    const btnPause = document.getElementById('btn-pause');
    const chkDamage = document.getElementById('chk-damage');
    const chkBands = document.getElementById('chk-bands');
    let pointerDown = false;
    let shownFrameId = 0;
    let lastState = null;
    let queue = Promise.resolve();

    function enqueue(fn) {
      queue = queue.then(fn, fn);
      return queue;
    }

    function drawOverlay() {
      ctx.clearRect(0, 0, 320, 240);
      if (!lastState) return;
      if (chkBands.checked && Array.isArray(lastState.band_rects)) {
        ctx.strokeStyle = 'rgba(0, 220, 255, 0.85)';
        ctx.lineWidth = 1;
        for (const r of lastState.band_rects) {
          if (r.w > 0 && r.h > 0) {
            ctx.strokeRect(r.x + 0.5, r.y + 0.5, Math.max(1, r.w - 1), Math.max(1, r.h - 1));
          }
        }
      }
      if (chkDamage.checked && Array.isArray(lastState.damage)) {
        ctx.fillStyle = 'rgba(255, 180, 0, 0.14)';
        ctx.strokeStyle = 'rgba(255, 180, 0, 0.95)';
        ctx.lineWidth = 1;
        for (const r of lastState.damage) {
          if (r.w > 0 && r.h > 0) {
            ctx.fillRect(r.x, r.y, r.w, r.h);
            ctx.strokeRect(r.x + 0.5, r.y + 0.5, Math.max(1, r.w - 1), Math.max(1, r.h - 1));
          }
        }
      }
    }

    function applyState(data) {
      lastState = data;
      btnPause.textContent = data.paused ? '继续时钟' : '暂停时钟';
      btnPause.classList.toggle('active', !!data.paused);
      for (const r of [1, 4, 16]) {
        const el = document.getElementById('rate-' + r);
        if (el) el.classList.toggle('active', data.rate_x === r);
      }
      if (data.frame_id && data.frame_id !== shownFrameId) {
        shownFrameId = data.frame_id;
        img.src = '/frame.png?frame=' + encodeURIComponent(String(data.frame_id));
      }
      drawOverlay();
      stateEl.textContent = JSON.stringify(data, null, 2);
    }

    function refreshState() {
      return enqueue(async () => {
        const res = await fetch('/state');
        if (res.ok) applyState(await res.json());
      });
    }

    function sendInput(kind, v, x, y) {
      return enqueue(async () => {
        const params = new URLSearchParams({ kind });
        if (v !== undefined) params.set('v', String(v));
        if (x !== undefined) params.set('x', String(x));
        if (y !== undefined) params.set('y', String(y));
        const res = await fetch('/input', { method: 'POST', body: params.toString() });
        if (res.ok) applyState(await res.json());
      });
    }

    function sendClock(op, arg) {
      return enqueue(async () => {
        const params = new URLSearchParams({ op });
        if (op === 'step') params.set('ms', String(arg));
        if (op === 'rate') params.set('v', String(arg));
        const res = await fetch('/clock', { method: 'POST', body: params.toString() });
        if (res.ok) applyState(await res.json());
      });
    }

    function togglePause() {
      const op = lastState && lastState.paused ? 'resume' : 'pause';
      return sendClock(op);
    }

    function mapCoords(ev) {
      const r = img.getBoundingClientRect();
      const x = Math.max(0, Math.min(319, Math.floor((ev.clientX - r.left) * 320 / r.width)));
      const y = Math.max(0, Math.min(239, Math.floor((ev.clientY - r.top) * 240 / r.height)));
      return [x, y];
    }

    img.addEventListener('pointerdown', (ev) => {
      pointerDown = true;
      img.setPointerCapture(ev.pointerId);
      const [x, y] = mapCoords(ev);
      sendInput('down', 1, x, y);
    });
    img.addEventListener('pointermove', (ev) => {
      if (!pointerDown) return;
      const [x, y] = mapCoords(ev);
      sendInput('move', 1, x, y);
    });
    img.addEventListener('pointerup', (ev) => {
      if (!pointerDown) return;
      pointerDown = false;
      const [x, y] = mapCoords(ev);
      sendInput('up', 1, x, y);
    });
    img.addEventListener('pointercancel', () => {
      if (!pointerDown) return;
      pointerDown = false;
      sendInput('cancel', 1);
    });

    window.addEventListener('keydown', (ev) => {
      if (ev.key === 'ArrowUp' || ev.key === 'ArrowLeft') { ev.preventDefault(); sendInput('prev'); }
      else if (ev.key === 'ArrowDown' || ev.key === 'ArrowRight') { ev.preventDefault(); sendInput('next'); }
      else if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); sendInput('activate'); }
      else if (ev.key === 'Escape' || ev.key === 'Backspace') { ev.preventDefault(); sendInput('back'); }
      else if (ev.key === '+' || ev.key === '=') { sendInput('adjust', 1); }
      else if (ev.key === '-' || ev.key === '_') { sendInput('adjust', -1); }
    });

    setInterval(() => {
      enqueue(async () => {
        const res = await fetch('/tick', { method: 'POST' });
        if (res.ok) applyState(await res.json());
      });
    }, 100);

    refreshState();
  </script>
</body>
</html>
